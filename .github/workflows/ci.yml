name: CI (native, stand-in)

# Manual only: Actions minutes can cost money. To run on every change, add the triggers, for example:
#   on:
#     workflow_dispatch:
#     pull_request:
#     push:
#       branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The same install a person runs: server and tools environments, web app, default (stand-in) machine config.
      # The machine config is a scratch file so nothing depends on the runner's home folder.
      - name: Install
        env:
          GENSTAGE_MACHINE_CONFIG: ${{ runner.temp }}/machine.json
        run: ./install.sh --dev

      - name: Pipeline, server (lint, types, tests) and web app (tests, build)
        env:
          GENSTAGE_MACHINE_CONFIG: ${{ runner.temp }}/machine.json
          GENSTAGE_SERVER_CONFIG: ${{ runner.temp }}/studio.json
        run: |
          echo '{"data_dir": "${{ runner.temp }}/studio-data"}' > "$GENSTAGE_SERVER_CONFIG"
          scripts/check.sh pipeline server ui

      - name: Scripted MCP walkthrough (must run, not skip)
        env:
          GENSTAGE_MACHINE_CONFIG: ${{ runner.temp }}/machine.json
          GENSTAGE_TEST_TOOLS_PYTHON: ${{ github.workspace }}/.venv-tools/bin/python
        working-directory: server
        run: uv run --no-sync pytest tests/test_mcp_walkthrough.py -q -rs | tee walkthrough.txt && grep -q " passed" walkthrough.txt && ! grep -q skipped walkthrough.txt

      - name: Web app end-to-end specs
        env:
          GENSTAGE_MACHINE_CONFIG: ${{ runner.temp }}/machine.json
        working-directory: ui
        run: |
          npx playwright install --with-deps chromium
          npm run e2e:world

      - name: Start and smoke test
        env:
          GENSTAGE_MACHINE_CONFIG: ${{ runner.temp }}/machine.json
          GENSTAGE_SERVER_CONFIG: ${{ runner.temp }}/studio.json
        run: |
          ./start.sh &
          pid=$!
          trap 'kill $pid' EXIT
          python3 scripts/smoke.py http://127.0.0.1:4280
