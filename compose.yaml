# The demo: `docker compose up`, then open http://127.0.0.1:4280. No GPU, no model, no account.
# The page is published on this computer's loopback only. The port inside the container must equal the port outside
# (the servers check the address a request names), so change both with GENSTAGE_WEB_PORT=4390 docker compose up.
# To try a real model, mount an edited machine config over the default (see docs/platform.md):
#   - ./machine.json:/etc/generative-stage/machine.json:ro
services:
  generative-stage:
    image: ${GENSTAGE_IMAGE:-generative-stage:1.0}
    build: .
    environment:
      GENSTAGE_WEB_PORT: ${GENSTAGE_WEB_PORT:-4280}
    ports:
      - "127.0.0.1:${GENSTAGE_WEB_PORT:-4280}:${GENSTAGE_WEB_PORT:-4280}"
    volumes:
      - data:/data
    restart: unless-stopped
volumes:
  data:
